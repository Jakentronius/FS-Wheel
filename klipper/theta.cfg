# Theta: 4th-axis rotary tombstone, driven as a Klipper manual_stepper on the
# SKR 1.4 Turbo's E0 driver slot. Append to (or [include] from) printer.cfg.
#
# It is NOT part of the toolhead, so G1 does not move it; the dashboard jogs
# it through the THETA_JOG macro below and Mainsail/MDI can use
#   MANUAL_STEPPER STEPPER=theta MOVE=<deg> SPEED=<deg/s>
# There is no endstop, so position is wherever it was at power-on; THETA_ZERO
# (dashboard "Zero θ") resets the register. If you add a switch later, set
# endstop_pin here and use MANUAL_STEPPER ... STOP_ON_ENDSTOP=1 to home.
#
# This Klipper build's manual_stepper has no get_status, so the position is
# kept in THETA_STATE's `pos` variable (which Moonraker can read). Always move
# theta through THETA_JOG / THETA_MOVE so the register stays in step; a raw
# MANUAL_STEPPER MOVE from the MDI will not update it.

[manual_stepper theta]
step_pin: P2.13          # E0 on SKR 1.4 Turbo (E1 would be P1.15 / P1.14 / !P1.16)
dir_pin: P0.11           # prefix with ! if the tombstone turns the wrong way
enable_pin: !P2.12
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 360   # "distance" is degrees: one motor rev = 360 deg ...
gear_ratio: 1:1          # ... divided by the tombstone's reduction, e.g. 90:1
velocity: 10             # default deg/s if SPEED is not given
accel: 50                # deg/s^2

[gcode_macro THETA_STATE]
description: Software position register for theta, degrees (read by the dashboard)
variable_pos: 0.0
gcode:
  RESPOND MSG="theta = {printer['gcode_macro THETA_STATE'].pos} deg"

[gcode_macro THETA_JOG]
description: Jog theta by D degrees at F deg/s (relative, waits for the move)
gcode:
  {% set d = params.D|default(0)|float %}
  {% set f = params.F|default(10)|float %}
  {% set cur = printer['gcode_macro THETA_STATE'].pos|float %}
  MANUAL_STEPPER STEPPER=theta MOVE={cur + d} SPEED={f} SYNC=1
  SET_GCODE_VARIABLE MACRO=THETA_STATE VARIABLE=pos VALUE={cur + d}

[gcode_macro THETA_MOVE]
description: Move theta to absolute A degrees at F deg/s
gcode:
  {% set a = params.A|default(0)|float %}
  {% set f = params.F|default(10)|float %}
  MANUAL_STEPPER STEPPER=theta MOVE={a} SPEED={f} SYNC=1
  SET_GCODE_VARIABLE MACRO=THETA_STATE VARIABLE=pos VALUE={a}

[gcode_macro THETA_ZERO]
description: Make the current theta position 0 deg
gcode:
  MANUAL_STEPPER STEPPER=theta SET_POSITION=0
  SET_GCODE_VARIABLE MACRO=THETA_STATE VARIABLE=pos VALUE=0

[gcode_macro THETA_OFF]
description: Release the theta motor so the tombstone can be turned by hand
gcode:
  MANUAL_STEPPER STEPPER=theta ENABLE=0
